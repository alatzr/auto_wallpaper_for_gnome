[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallpaper-changer"
version = "0.1.0"
description = "Wallpaper changer for GNOME with multi-monitor support"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
wallpaper-changer = "wallpaper_changer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
