app-id: io.github.alatzr.WallpaperChanger
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: wallpaper-changer-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --talk-name=org.gnome.Mutter.DisplayConfig
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem
  - --filesystem=xdg-pictures
  - --filesystem=home

modules:
  - name: wallpaper-changer
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app .
      - install -Dm644 data/io.github.alatzr.WallpaperChanger.desktop /app/share/applications/io.github.alatzr.WallpaperChanger.desktop
      - install -Dm644 data/io.github.alatzr.WallpaperChanger.metainfo.xml /app/share/metainfo/io.github.alatzr.WallpaperChanger.metainfo.xml
      - install -Dm644 data/io.github.alatzr.WallpaperChanger.svg /app/share/icons/hicolor/scalable/apps/io.github.alatzr.WallpaperChanger.svg
    sources:
      - type: dir
        path: .
